# The site, built from the repository's own files on every push to main (the released version) and
# published on GitHub Pages: https://lucasdantas2701.github.io/ANCHOR/ is the presentation (landing/,
# Angular), and the documentation lives under it (docs/, commands/, evaluation/..., MkDocs).
name: Documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.6
      - run: python .github/scripts/build_site.py
      - run: mkdocs build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: The presentation, at the site's root
        working-directory: landing
        run: |
          npm ci
          npm run build
          rm -f dist/prerendered-routes.json
          cp -r dist/. ../site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
