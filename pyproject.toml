# Configuration of the code-style tools.

[tool.isort]
# Import order (PEP 8), with a blank line between the groups:
#   1. Python's standard library
#   2. third-party libraries (playwright, pytest...)
#   3. the project's own modules
profile = "black"
known_first_party = ["anchor", "eval", "tests", "examples"]
line_length = 100
