site_name: ANCHOR
site_description: >-
  ANCHOR web automation agent: self-healing web automation that runs locally with Ollama and
  Playwright. Describe the task in plain language, a small local LLM plans it, and you stay in control.
site_url: https://lucasdantas2701.github.io/ANCHOR/
site_author: Lucas dos Santos Dantas
repo_url: https://github.com/LucasDantas2701/ANCHOR
repo_name: LucasDantas2701/ANCHOR
edit_uri: ""
copyright: ANCHOR is open source, under the Apache 2.0 license.
docs_dir: site_src
# The menu (nav:) is written by .github/scripts/build_site.py, from the pages it makes.
INHERIT: site_nav.yml

theme:
  name: material
  custom_dir: docs/site/overrides
  logo: assets/anchor-icon.svg
  font:
    text: Geist
    code: Geist Mono
  favicon: assets/anchor-icon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/anchor-site.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LucasDantas2701/ANCHOR
  # Google Search Console: paste the code of its "HTML tag" method here to verify the site.
  google_site_verification: "U0F9cBZuoO__46hb5AAFhggcmECcGGra2WtUPkiOjyc"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences


validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
