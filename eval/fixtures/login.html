<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Portal Login</title></head><body>
<form style="width:300px;margin:40px auto">
  <h2>Welcome back</h2>
  <label for="user">Username</label><input id="user" name="username">
  <label for="pwd">Password</label><input id="pwd" name="password" type="password">
  <button type="button" aria-label="Show password" class="toggle-pwd"><i class="icon-eye" style="display:inline-block;width:16px;height:16px"></i></button>
  <label><input type="checkbox" name="remember"> Remember me</label>
  <a href="/forgot">Forgot your password?</a>
  <button type="submit" id="login-btn">Log in</button>
  <p>New here? <a href="/signup">Create an account</a></p>
  <select name="lang" aria-label="Language"><option>English</option><option>Português</option></select>
</form>
<script src="feedback.js"></script>
</body></html>
