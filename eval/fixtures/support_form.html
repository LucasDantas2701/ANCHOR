<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Formulário de suporte</title></head>
<body>
<h1>Formulário de suporte</h1>
<form onsubmit="return false">
  <p><label>Nome <input id="name"></label></p>
  <p><label>E-mail <input id="email" type="email"></label></p>
  <p><label>Mensagem <textarea id="message"></textarea></label></p>
  <p><button id="send" onclick="document.body.dataset.sent = '1'; document.getElementById('ok').textContent = 'Recebemos sua mensagem.'">Enviar mensagem</button></p>
</form>
<p id="ok" role="status"></p>
<script src="feedback.js"></script>
</body></html>
