<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cadastro de Colaborador</title>
<style>.tb i{display:inline-block;width:18px;height:18px}</style></head><body>
<div class="tb">
  <button aria-label="Imprimir"><i class="fa fa-print"></i></button>
  <button><i class="fa fa-download"></i></button>
  <a href="/ajuda"><i class="fa fa-circle-question"></i></a>
</div>
<h1>Cadastro de colaborador</h1>
<form>
  <fieldset><legend>Dados pessoais</legend>
    <label for="nome">Nome completo</label><input id="nome" name="nome">
    <label for="cpf">CPF</label><input id="cpf" name="cpf" placeholder="000.000.000-00">
    <label for="nasc">Data de nascimento</label><input id="nasc" type="date">
    <label for="mail">E-mail corporativo</label><input id="mail" type="email">
    <label for="tel">Telefone</label><input id="tel" type="tel">
  </fieldset>
  <fieldset><legend>Contrato</legend>
    <label for="dep">Departamento</label>
    <select id="dep"><option>Selecione</option><option>Financeiro</option><option>TI</option><option>RH</option></select>
    <span>Tipo de contrato:</span>
    <label><input type="radio" name="tipo" value="clt"> CLT</label>
    <label><input type="radio" name="tipo" value="pj"> PJ</label>
    <label for="obs">Observações</label><textarea id="obs"></textarea>
  </fieldset>
  <label><input type="checkbox" id="termos"> Li e aceito os termos de uso</label>
  <button type="button" class="cancel">Cancelar</button>
  <button type="submit" class="save">Salvar cadastro</button>
  <button type="button" disabled>Enviar para aprovação</button>
</form>
<p class="status">Último salvamento: 25/09/2026 14:32</p>
<script src="feedback.js"></script>
</body></html>
