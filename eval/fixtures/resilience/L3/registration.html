<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cadastro de Colaborador</title>
<style>.tb i{display:inline-block;width:18px;height:18px}</style></head><body>
<div class="tb">
  <div><span><button aria-label="Imprimir"><i class="fa fa-print"></i></button></span></div>
  <div><span><button><i class="fa fa-download"></i></button></span></div>
  <a href="/ajuda"><i class="fa fa-circle-question"></i></a>
</div>
<h1>Cadastro de colaborador</h1>
<form><div><span><button type="button" class="cancel">Cancelar</button></span></div><div><span><button type="submit" class="save" data-eval="e7">Salvar cadastro</button></span></div><div><span><button type="button" disabled="">Enviar para aprovação</button></span></div>
  <fieldset><legend>Dados pessoais</legend>
    <label for="nome">Nome completo</label><div><span><input id="nome" name="nome" data-eval="e1"></span></div>
    <label for="cpf">CPF</label><div><span><input id="cpf" name="cpf" placeholder="000.000.000-00" data-eval="e2"></span></div>
    <label for="nasc">Data de nascimento</label><div><span><input id="nasc" type="date"></span></div>
    <label for="mail">E-mail corporativo</label><div><span><input id="mail" type="email" data-eval="e3"></span></div>
    <label for="tel">Telefone</label><div><span><input id="tel" type="tel" data-eval="e8"></span></div>
  </fieldset>
  <fieldset><legend>Contrato</legend>
    <label for="dep">Departamento</label>
    <div><span><select id="dep" data-eval="e4"><option>Selecione</option><option>Financeiro</option><option>TI</option><option>RH</option></select></span></div>
    <span>Tipo de contrato:</span>
    <label><div><span><input type="radio" name="tipo" value="clt"></span></div> CLT</label>
    <label><div><span><input type="radio" name="tipo" value="pj" data-eval="e5"></span></div> PJ</label>
    <label for="obs">Observações</label><div><span><textarea id="obs" data-eval="e9"></textarea></span></div>
  </fieldset>
  <label><div><span><input type="checkbox" id="termos" data-eval="e6"></span></div> Li e aceito os termos de uso</label>
  
  
  
</form>
<p class="status">Último salvamento: 25/09/2026 14:32</p>
<script src="../../feedback.js"></script>

</body></html>
