<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Employee Registration</title>
<style>.tb i{display:inline-block;width:18px;height:18px}</style></head><body>
<div class="tb">
  <button aria-label="Print"><i class="fa fa-print"></i></button>
  <button><i class="fa fa-download"></i></button>
  <a href="/help"><i class="fa fa-circle-question"></i></a>
</div>
<h1>Employee registration</h1>
<form>
  <fieldset><legend>Personal details</legend>
    <label for="nome">Full name</label><input id="nome" name="name" data-eval="e1">
    <label for="cpf">Tax ID</label><input id="cpf" name="tax_id" placeholder="000-00-0000" data-eval="e2">
    <label for="nasc">Date of birth</label><input id="nasc" type="date">
    <label for="mail">Work e-mail</label><input id="mail" type="email" data-eval="e3">
    <label for="tel">Phone</label><input id="tel" type="tel" data-eval="e8">
  </fieldset>
  <fieldset><legend>Contract</legend>
    <label for="dep">Department</label>
    <select id="dep" data-eval="e4"><option>Select</option><option>Finance</option><option>IT</option><option>HR</option></select>
    <span>Contract type:</span>
    <label><input type="radio" name="tipo" value="clt"> Employee</label>
    <label><input type="radio" name="tipo" value="pj" data-eval="e5"> Contractor</label>
    <button type="button" onclick="this.nextElementSibling.hidden = false; this.remove()">Show more</button><div hidden=""><label for="obs">Notes</label><textarea id="obs" data-eval="e9"></textarea><label><input type="checkbox" id="termos" data-eval="e6"> I have read and accept the terms of use</label></div>
  </fieldset>
  
  <button type="button" class="cancel">Cancel</button>
  <button type="submit" class="save" data-eval="e7">Save registration</button>
  <button type="button" disabled="">Send for approval</button>
</form>
<p class="status">Last saved: 09/25/2026 2:32 PM</p>
<script src="../../feedback.js"></script>

<div role="dialog" aria-modal="true" style="position:fixed;inset:0;z-index:9999;background:rgba(255,255,255,.96);padding:40px"><p>We use cookies to improve your experience.</p>
            <button type="button" onclick="this.parentElement.remove()">Accept cookies</button>
            <button type="button" onclick="this.parentElement.remove()">Decline</button></div></body></html>
