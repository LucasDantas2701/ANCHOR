<div class="busca">
  <input id="s" aria-label="Pesquisar" placeholder="Pesquisar" oninput="const l=document.getElementById('sug'); l.hidden=!this.value;
             l.innerHTML=['', ' júnior', ' remoto'].map(x=&gt;`&lt;div role=option style='cursor:pointer' onclick='const i=document.getElementById(&quot;s&quot;); i.value=this.textContent; window.buscou=this.textContent; document.getElementById(&quot;sug&quot;).hidden=true'&gt;${this.value}${x}&lt;/div&gt;`).join('')" data-eval="e1">
  <div id="sug" role="listbox" hidden=""></div>
</div>
<main><h1>Vagas recomendadas</h1></main>
<script src="../../feedback.js"></script>
