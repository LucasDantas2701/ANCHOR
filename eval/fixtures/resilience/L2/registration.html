<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cadastro de Colaborador</title>
<style>.tb i{display:inline-block;width:18px;height:18px}</style></head><body>
<div class="tb">
  <button aria-label="Imprimir"><i class="fa fa-print"></i></button>
  <button><i class="fa fa-download"></i></button>
  <a href="/ajuda"><i class="fa fa-circle-question"></i></a>
</div>
<h1>Cadastro de colaborador</h1>
<form>
  <fieldset><legend>Dados pessoais</legend>
    <label for="nome">Seu nome</label><input id="nome" name="nome" data-eval="e1">
    <label for="cpf">CPF</label><input id="cpf" name="cpf" placeholder="000.000.000-00" data-eval="e2">
    <label for="nasc">Data de nascimento</label><input id="nasc" type="date">
    <label for="mail">E-mail de trabalho</label><input id="mail" type="email" data-eval="e3">
    <label for="tel">Celular</label><input id="tel" type="tel" data-eval="e8">
  </fieldset>
  <fieldset><legend>Contrato</legend>
    <label for="dep">Setor</label>
    <select id="dep" data-eval="e4"><option>Selecione</option><option>Financeiro</option><option>TI</option><option>RH</option></select>
    <span>Tipo de contrato:</span>
    <label><input type="radio" name="tipo" value="clt"> CLT</label>
    <label><input type="radio" name="tipo" value="pj" data-eval="e5"> PJ</label>
    <label for="obs">Comentários</label><textarea id="obs" data-eval="e9"></textarea>
  </fieldset>
  <label><input type="checkbox" id="termos" data-eval="e6"> Concordo com os termos</label>
  <button type="button" class="cancel">Cancelar</button>
  <button type="submit" class="save" data-eval="e7">Gravar cadastro</button>
  <button type="button" disabled="">Enviar para aprovação</button>
</form>
<p class="status">Último salvamento: 25/09/2026 14:32</p>
<script src="../../feedback.js"></script>

</body></html>
