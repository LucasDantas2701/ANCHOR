<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Admin — Users</title>
<style>td,th{padding:4px 8px} .btn-icon{width:28px;height:28px}</style></head><body>
<h1>Users</h1>
<div class="toolbar">
  <input type="text" placeholder="Search by name or e-mail" aria-label="Search users">
  <select aria-label="Filter by status"><option>All</option><option>Active</option><option>Inactive</option></select>
  <button class="primary">+ New user</button>
  <button title="Export spreadsheet" class="btn-icon"><img src="/static/icons/file-excel.png" alt="" width="16" height="16"></button>
</div>
<table>
  <thead><tr><th><input type="checkbox" aria-label="Select all"></th><th>Name</th><th>E-mail</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody>
    <tr><td><input type="checkbox" aria-label="Select Anna Smith"></td><td>Anna Smith</td><td>anna@company.com</td><td>Active</td>
      <td><button class="btn-icon" title="Edit"><svg width="16" height="16"><use href="#icon-pencil"></use></svg></button>
          <button class="btn-icon" title="Delete"><svg width="16" height="16"><use href="#icon-trash"></use></svg></button></td></tr>
    <tr><td><input type="checkbox" aria-label="Select Brian Lee"></td><td>Brian Lee</td><td>brian@company.com</td><td>Inactive</td>
      <td><button class="btn-icon" title="Edit"><svg width="16" height="16"><use href="#icon-pencil"></use></svg></button>
          <button class="btn-icon" title="Delete"><svg width="16" height="16"><use href="#icon-trash"></use></svg></button></td></tr>
    <tr><td><input type="checkbox" aria-label="Select Carol Miller"></td><td>Carol Miller</td><td>carol@company.com</td><td>Active</td>
      <td><button class="btn-icon" title="Edit"><svg width="16" height="16"><use href="#icon-pencil"></use></svg></button>
          <button class="btn-icon" title="Delete"><svg width="16" height="16"><use href="#icon-trash"></use></svg></button></td></tr>
  </tbody>
</table>

</body></html>
