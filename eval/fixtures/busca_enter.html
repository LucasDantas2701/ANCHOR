<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Portal de Vagas</title></head><body>
<header><strong>Portal de Vagas</strong> <a href="/inicio">Início</a> <a href="/rede">Minha rede</a>
  <a href="/mensagens">Mensagens</a></header>
<div class="busca">
  <input id="s" aria-label="Pesquisar" placeholder="Pesquisar"
    oninput="const l=document.getElementById('sug'); l.hidden=!this.value;
             l.innerHTML=['', ' júnior', ' remoto'].map(x=>`<div role=option style='cursor:pointer' onclick='const i=document.getElementById(&quot;s&quot;); i.value=this.textContent; window.buscou=this.textContent; document.getElementById(&quot;sug&quot;).hidden=true'>${this.value}${x}</div>`).join('')">
  <div id="sug" role="listbox" hidden></div>
</div>
<main><h1>Vagas recomendadas</h1></main>
</body></html>
